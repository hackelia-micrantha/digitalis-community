name: Production smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: read

concurrency:
  group: production-smoke
  cancel-in-progress: true

jobs:
  smoke:
    name: Verify digitalis.micrantha.com
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify production routes and headers
        run: python3 scripts/smoke_production.py

      - name: Compile smoke test
        run: python3 -m py_compile scripts/smoke_production.py
