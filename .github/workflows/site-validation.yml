name: Site validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate public site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate publication provenance
        run: python3 scripts/validate_publication.py

      - name: Validate publication boundary
        run: python3 scripts/validate_site.py

      - name: Compile validation scripts
        run: python3 -m py_compile scripts/validate_publication.py scripts/validate_site.py
